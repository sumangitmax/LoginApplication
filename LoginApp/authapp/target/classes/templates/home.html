<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <title>Homepage</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 100px; background-color: #f4f4f9; }
        .container { background: white; display: inline-block; padding: 40px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        a { color: #007bff; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome, <span th:text="${username}">User</span>! 👋</h1>
        <p>You have successfully logged into your dashboard.</p>
        <br>
        <a th:href="@{/}">Logout</a>
    </div>
</body>
</html>
